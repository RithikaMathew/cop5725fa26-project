[project]
name = "cop5725fa26-project"
version = "0.1.0"
description = "COP5725 semester project: SQL/DuckDB pipeline over 2024 Hacker News story submissions"
readme = "README.md"
authors = [
    { name = "Rithika Mathew", email = "rmathew1@ufl.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
